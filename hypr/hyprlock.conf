background {
    monitor =
    path = ~/Pictures/wallpaper/grayscale-geo.png
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.8
    brightness = 0.4
    vibrancy = 0.0
}

# ── Time ──
label {
    monitor =
    text = $TIME
    color = rgba(ffffffee)
    font_size = 96
    font_family = JetBrains Mono

    position = 0, 200
    halign = center
    valign = center
}

# ── Date ──
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(888888cc)
    font_size = 18
    font_family = JetBrains Mono

    position = 0, 130
    halign = center
    valign = center
}

# ── Greeting ──
label {
    monitor =
    text = $USER
    color = rgba(cccccccc)
    font_size = 14
    font_family = JetBrains Mono

    position = 0, 20
    halign = center
    valign = center
}

# ── Password input ──
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2

    dots_size = 0.2
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(ffffff22)
    inner_color = rgba(1a1a1aee)
    font_color = rgba(e0e0e0ff)

    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <span foreground="##555555">password</span>
    hide_input = false

    rounding = 12
    check_color = rgba(ffffff88)
    fail_color = rgba(ffffff44)
    fail_text = <span foreground="##888888">$FAIL ($ATTEMPTS)</span>
    fail_transition = 200

    capslock_color = rgba(555555ff)
    numlock_color = -1
    bothlock_color = -1

    position = 0, -40
    halign = center
    valign = center
}
