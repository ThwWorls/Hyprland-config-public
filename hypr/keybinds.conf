$mainMod = SUPER

#################
### APPS      ###
#################

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, R, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser

#################
### WINDOWS   ###
#################

bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit,

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Swap windows on current workspace: SUPER+ALT+arrows
bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d

# Resize: SUPER+SHIFT+arrows
binde = $mainMod SHIFT, right, resizeactive, 40 0
binde = $mainMod SHIFT, left, resizeactive, -40 0
binde = $mainMod SHIFT, up, resizeactive, 0 -40
binde = $mainMod SHIFT, down, resizeactive, 0 40

# Move/resize with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

####################
### WORKSPACES   ###
####################

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

bind = $mainMod, TAB, workspace, previous

# Navigate adjacent workspaces: SUPER+CTRL+Left/Right or SUPER+scroll
bind = $mainMod CTRL, left, workspace, e-1
bind = $mainMod CTRL, right, workspace, e+1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move current window to adjacent workspace: SUPER+CTRL+SHIFT+Left/Right
bind = $mainMod CTRL SHIFT, left, movetoworkspace, e-1
bind = $mainMod CTRL SHIFT, right, movetoworkspace, e+1

# Scratchpad (SUPER+grave = tilde key)
bind = $mainMod, grave, togglespecialworkspace, magic
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic

####################
### SCREENSHOTS / RECORD ###
####################
# Do NOT paste these lines into a terminal — they belong in this file only.
# SUPER+SHIFT+S → region + annotate in satty (draw red boxes, arrows, etc.)
# SUPER+SHIFT+R → toggle region video recording (wf-recorder)
# Print         → full monitor screenshot (no editor)

bind = , PRINT, exec, hyprshot -m output -o ~/Pictures/screenshots/ -f "screenshot_$(date +'%Y%m%d_%H%M%S').png" -c
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot-annotate.sh
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/screen-record-toggle.sh

####################
### TOOLS        ###
####################

bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, O, exec, killall waybar; waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css &

####################
### MEDIA KEYS   ###
####################

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = , XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
