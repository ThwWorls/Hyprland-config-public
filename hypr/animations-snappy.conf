animations {
    enabled = true

    bezier = snap, 0.15, 0, 0.1, 1
    bezier = snapOut, 0.3, 0, 0, 1
    bezier = snapIn, 0.5, 0.8, 0.2, 1

    animation = windows, 1, 2, snap, popin 80%
    animation = windowsOut, 1, 2, snapOut, popin 80%
    animation = windowsMove, 1, 2, snap

    animation = border, 1, 4, default
    animation = borderangle, 1, 4, default

    animation = fade, 1, 2, snapIn
    animation = fadeOut, 1, 2, snapOut

    animation = workspaces, 1, 2, snap, slide
}
