################
### MONITORS ###
################

# Edit after install: run `hyprctl monitors` and set your outputs.
# Examples:
#   monitor = eDP-1, 1920x1080@60, 0x0, 1
#   monitor = HDMI-A-1, 1920x1080@144, 1920x0, 1
monitor = , preferred, auto, 1


###################
### MY PROGRAMS ###
###################

$terminal = alacritty
$fileManager = thunar
$menu = wofi --show drun
# Change to your browser binary if needed
$browser = firefox


#################
### AUTOSTART ###
#################

exec-once = waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css
exec-once = hyprpaper
exec-once = dunst


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    col.active_border = rgba(ffffffee)
    col.inactive_border = rgba(333333aa)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.92

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(00000088)
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        noise = 0.02
        contrast = 1.1
        brightness = 0.9
        vibrancy = 0.0
    }
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Steady refresh helps HDMI monitors and workspace animations
debug {
    vfr = false
}


#############
### INPUT ###
#############

input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options = grp:win_space_toggle
    kb_rules =

    follow_mouse = 1
    # -1.0 .. 1.0 (software pointer speed; not hardware DPI)
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

# Optional per-device pointer speed (names from: hyprctl devices)
# device {
#     name = my-mouse-name-
#     sensitivity = -0.35
#     accel_profile = flat
# }

# gestures were removed in newer Hyprland versions
# if your version supports them, uncomment:
# gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
# }


##############################
### WINDOWS AND WORKSPACES ###
##############################

workspace = 1, persistent:true, default:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true

windowrule = suppress_event maximize, match:class .*
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true


#######################
### SOURCE MODULES  ###
#######################

source = ~/.config/hypr/animations-smooth.conf
source = ~/.config/hypr/keybinds.conf
